name: StickMe Android Signed Binary

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode for this release build
        required: true
        default: "1"
      version_name:
        description: Android versionName for this release build
        required: true
        default: "0.1.0"

jobs:
  signed-binary:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stickme-android-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD secret is missing" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ANDROID_KEY_PASSWORD secret is missing" >&2
            exit 1
          fi
          mkdir -p secrets
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > secrets/stickme-upload-key.jks
          {
            echo "storeFile=secrets/stickme-upload-key.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Preflight release gate
        run: bash scripts/preflight_release_gate.sh .

      - name: Build signed release artifacts
        run: |
          gradle clean :app:bundleRelease :app:assembleRelease \
            -PVERSION_CODE=${{ inputs.version_code }} \
            -PVERSION_NAME=${{ inputs.version_name }} \
            --stacktrace

      - name: Verify signed artifacts
        run: bash scripts/verify_android_release.sh .

      - name: Upload signed binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickme-android-signed-binary-${{ inputs.version_code }}
          if-no-files-found: error
          path: |
            stickme-android-mvp/app/build/outputs/bundle/release/*.aab
            stickme-android-mvp/app/build/outputs/apk/release/*.apk
            stickme-android-mvp/app/build/outputs/mapping/release/mapping.txt
            stickme-android-mvp/stickme-release-SHA256SUMS.txt
