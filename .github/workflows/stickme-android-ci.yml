name: StickMe Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'stickme-android-mvp/**'
      - '.github/workflows/stickme-android-ci.yml'
  pull_request:
    paths:
      - 'stickme-android-mvp/**'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build StickMe debug APK
        working-directory: stickme-android-mvp
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickme-debug-apk
          path: stickme-android-mvp/app/build/outputs/apk/debug/*.apk
